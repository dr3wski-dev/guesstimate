<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Defense-in-depth per SECURITY_NOTES.md: this page parses URL params
     (?challenge=1&from=...&score=...&d=...) into the DOM. They're sanitized in JS
     regardless, but a CSP costs nothing and would have blocked the earlier
     reflected-XSS bug documented there even before the code-level fix existed.
     Fonts are self-hosted now, so this no longer needs to allow googleapis/gstatic
     at all — the only non-'self' source left is data: for the inline SVG favicon. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; object-src 'none'; form-action 'self';">
<link rel="canonical" href="https://guesstimate.app/">
<title>Guesstimate — Daily Sports Stat Guessing Game</title>
<meta name="description" content="Five sports stat questions a day. Real players are plotted on a chart — you guess where another one falls. Same questions for everyone, every day.">
<!-- Open Graph / Twitter. This game's distribution model is people pasting a link
     into a group chat, which means this card IS the landing page for most players.
     NOTE FOR DEPLOY: og:image and og:url must become absolute URLs on the real
     domain — most crawlers (including iMessage's) will not resolve a relative
     og:image. Regenerate the image from assets/og-source.html; see that file. -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://guesstimate.app/">
<meta property="og:site_name" content="Guesstimate">
<meta property="og:title" content="Guesstimate — Daily Sports Stat Guessing Game">
<meta property="og:description" content="Five questions a day. Real players plotted on a chart — guess where the next one falls. How close can you get?">
<meta property="og:image" content="https://guesstimate.app/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Guesstimate — a scatter chart with plotted sports players and a guess marker.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Guesstimate — Daily Sports Stat Guessing Game">
<meta name="twitter:description" content="Five questions a day. Real players plotted on a chart — guess where the next one falls.">
<meta name="twitter:image" content="https://guesstimate.app/assets/og-image.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231b1810'/%3E%3Cpath d='M6 26 H27' stroke='%23f2efe4' stroke-width='2.5' stroke-linecap='round'/%3E%3Cpath d='M6 26 V5' stroke='%23f2efe4' stroke-width='2.5' stroke-linecap='round'/%3E%3Ccircle cx='12' cy='19' r='2.6' fill='%23f0b429'/%3E%3Ccircle cx='20' cy='12' r='3.4' fill='%232f5fd6' stroke='%23f2efe4' stroke-width='1.6'/%3E%3C/svg%3E">
<!-- The first screen renders in all three families at once: the title is Fraunces,
     the body copy Work Sans, and the topline and buttons IBM Plex Mono. Without
     these, the browser can't discover any of them until it has parsed the stylesheet,
     so the fetch starts late and text swaps in visibly. Only the faces the first
     screen actually uses are preloaded — preloading the rest would compete with the
     questions API call for the same connection. -->
<link rel="preload" href="assets/fonts/worksans-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/fraunces-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/ibmplexmono-400.woff2" as="font" type="font/woff2" crossorigin>
<script>
// Applied synchronously, before CSS paints, so a returning player with a saved
// dark-mode preference doesn't see a flash of the light theme first.
(function(){
  try{
    var t = localStorage.getItem('guesstimate_theme');
    if(t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>
<style>
  /* Self-hosted fonts (latin subset only). Removes three render-blocking
     third-party requests, kills the font-swap flash, and lets the CSP above drop
     its googleapis/gstatic allowances entirely — consistent with the project's
     stated "minimize dependencies and attack surface" posture. Fraunces and Work
     Sans ship as variable fonts, so one file each covers every weight used.

     Mono ships 400, 600 and 700 — the three weights actually applied to elements.
     A 500 file was being served and never used by any rule; fonts are already
     woff2-compressed so the CDN can't shrink them, which makes an unused face pure
     transfer cost. Check before adding one back: `grep -o "font-weight:[^;]*"`. */
  @font-face{font-family:'Fraunces';font-style:normal;font-weight:600 900;font-display:swap;src:url('assets/fonts/fraunces-var.woff2') format('woff2');}
  @font-face{font-family:'Work Sans';font-style:normal;font-weight:400 700;font-display:swap;src:url('assets/fonts/worksans-var.woff2') format('woff2');}
  @font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;src:url('assets/fonts/ibmplexmono-400.woff2') format('woff2');}
  @font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:600;font-display:swap;src:url('assets/fonts/ibmplexmono-600.woff2') format('woff2');}
  @font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:700;font-display:swap;src:url('assets/fonts/ibmplexmono-700.woff2') format('woff2');}

  :root{
    --paper: #f2efe4; --paper-2: #e9e4d4;
    --ink: #1b1810; --ink-rgb: 27,24,16; --ink-soft: #55503f; --ink-faint: #5f5946;
    --line: rgba(27,24,16,0.18);
    --accent: #f0b429; --accent-ink: #4d3a06;
    --good: #1e6a41; --good-rgb: 30,106,65; --good-bg: #e4f3ea;
    --mid: #c88a00; --bad: #b53a2e;
    --guess: #2f5fd6;
    --panel-pad: 26px;
    /* Heat ramp for the six score bands. Ordered best -> worst, and used in three
       places that must agree: the verdict colour, the concentric bands drawn around
       the answer on reveal, and the emoji in the share strip. Green->gold->orange->red
       keeps the Wordle "green is good" convention while still reading as a heat map. */
    --t1: #12703a; --t2: #5a9e2f; --t3: #c9a227;
    --t4: #d97b29; --t5: #c0392b; --t6: #5d5347;
  }
  /* Per-league accent. Every question used to look identical — same paper, same
     axes, same three hollow dots — so five rounds a day read as one thing five
     times. Immaculate Grid gets this variety free from team logos; this is the
     cheap equivalent. Set on .app (not .panel) because the progress bar lives
     outside the panel and needs the same accent. */
  .app[data-league="NBA"]{ --accent:#ef8c3b; --accent-ink:#3a2405; }
  .app[data-league="NFL"]{ --accent:#57a877; --accent-ink:#0d2b1a; }
  .app[data-league="MLB"]{ --accent:#6d9ce0; --accent-ink:#0f2445; }
  /* Dark palette applies automatically for players whose OS is set to dark mode
     (unless they've explicitly picked light via the toggle), and always applies
     once data-theme="dark" is set explicitly. Mostly a straight paper/ink swap
     to keep the same retro-paper look; good/mid/bad/guess get brightened a touch
     since the muted light-mode versions read as too dark against a dark page. */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper: #17140f; --paper-2: #211d16;
      --ink: #f2ede0; --ink-rgb: 242,237,224; --ink-soft: #cfc8b8; --ink-faint: #a39c8a;
      --line: rgba(242,237,224,0.18);
      --good: #3ddc84; --good-rgb: 61,220,132; --good-bg: rgba(61,220,132,0.15);
      --mid: #e0a83c; --bad: #ff6b57;
      --guess: #6d93ff;
      --t1: #3ddc84; --t2: #8fd94a; --t3: #e8c34a;
      --t4: #f0913f; --t5: #f2685a; --t6: #9a8f80;
    }
  }
  :root[data-theme="dark"]{
    --paper: #17140f; --paper-2: #211d16;
    --ink: #f2ede0; --ink-rgb: 242,237,224; --ink-soft: #cfc8b8; --ink-faint: #a39c8a;
    --line: rgba(242,237,224,0.18);
    --good: #3ddc84; --good-rgb: 61,220,132; --good-bg: rgba(61,220,132,0.15);
    --mid: #e0a83c; --bad: #ff6b57;
    --guess: #6d93ff;
    --t1: #3ddc84; --t2: #8fd94a; --t3: #e8c34a;
    --t4: #f0913f; --t5: #f2685a; --t6: #9a8f80;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:var(--paper);
    background-image:repeating-linear-gradient(0deg, rgba(var(--ink-rgb),0.025) 0px, rgba(var(--ink-rgb),0.025) 1px, transparent 1px, transparent 3px);
    color:var(--ink); font-family:'Work Sans', sans-serif;
    display:flex; align-items:center; justify-content:center; padding:5vh 5vw;
  }
  /* The icon buttons used to be position:fixed at the top-right of the viewport,
     which collided with the topline's round counter on any narrow screen — on an
     iPhone the "1 / 5" rendered underneath two opaque circles. They live in the
     topline row now, so they can't overlap anything at any width. */
  .controls{ display:flex; gap:6px; }
  .icon-btn{
    width:32px; height:32px; display:flex; align-items:center; justify-content:center;
    font-size:13px; line-height:1; background:var(--paper); color:var(--ink);
    border:2px solid var(--ink); border-radius:50%; cursor:pointer;
    box-shadow:2px 2px 0 rgba(var(--ink-rgb),0.35); transition:transform .15s ease;
    font-family:'IBM Plex Mono',monospace; padding:0; flex:none;
  }
  .icon-btn:hover{ transform:translate(-1px,-1px); }
  .mono{font-family:'IBM Plex Mono', monospace;}
  :focus-visible{ outline:3px solid var(--ink); outline-offset:3px; }
  .app{ width:100%; max-width:620px; }

  .topline{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--ink-faint);
    letter-spacing:0.06em; text-transform:uppercase; margin-bottom:12px;
  }
  .topline-end{ display:flex; align-items:center; gap:10px; flex:none; }
  /* The topline label doubles as the way back to the home screen. A real <button>
     rather than a styled span so it's keyboard-reachable and announced as a
     control; the reset strips the chrome so it still reads as a label. */
  #topLeft{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  button.home-btn{
    font:inherit; letter-spacing:inherit; text-transform:inherit; color:inherit;
    background:none; border:0; padding:0; margin:0; cursor:pointer;
    border-bottom:1px solid transparent; text-align:left;
  }
  button.home-btn:hover, button.home-btn:focus-visible{ color:var(--ink); border-bottom-color:var(--ink); }
  .progress{ display:flex; gap:6px; margin-bottom:18px; }
  .progress .seg{ flex:1; height:6px; background:var(--paper-2); border:1.5px solid var(--ink); }
  .progress .seg.done{ background:var(--ink); }
  .progress .seg.active{ background:var(--accent); }
  .panel{
    background:var(--paper); border:2.5px solid var(--ink); border-radius:3px;
    box-shadow:7px 7px 0 var(--ink); padding:var(--panel-pad);
  }
  h1.title{ font-family:'Fraunces',serif; font-weight:700; font-size:clamp(24px,5vw,32px); margin:0 0 8px; line-height:1.05; }
  p.sub{ color:var(--ink-soft); margin:0 0 18px; line-height:1.5; font-size:14.5px; }
  button.primary{
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:14px; letter-spacing:0.03em;
    background:var(--ink); color:var(--paper); border:2px solid var(--ink); border-radius:3px;
    padding:12px 22px; cursor:pointer; box-shadow:4px 4px 0 rgba(var(--ink-rgb),0.35);
    transition:transform .15s ease;
  }
  button.primary:hover:not(:disabled){ transform:translate(-2px,-2px); }
  button.primary:disabled{ opacity:0.4; cursor:default; }
  button.ghost{
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13px;
    background:transparent; color:var(--ink); border:2px solid var(--ink); border-radius:3px;
    padding:10px 18px; cursor:pointer; transition:transform .15s ease;
  }
  button.ghost:hover{ transform:translate(-1px,-1px); }

  .league-tag{ display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.08em; background:var(--accent); color:var(--accent-ink); padding:3px 9px; border:1.5px solid var(--ink); margin-bottom:10px; }
  .prompt{ font-family:'Fraunces',serif; font-weight:600; font-size:21px; line-height:1.3; margin-bottom:4px; }
  .prompt .player{ color:var(--guess); }
  .instructions{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-faint); margin-bottom:14px; }

  .chart-frame{
    background:color-mix(in srgb, var(--accent) 12%, var(--paper));
    border:2.5px solid var(--ink); border-radius:3px; padding:6px;
    margin-bottom:12px; position:relative; touch-action:none;
  }
  .chart-frame svg{ width:100%; height:auto; display:block; cursor:crosshair; touch-action:none; }
  .chart-frame svg rect[tabindex]:focus-visible{ outline:3px solid var(--ink); outline-offset:-3px; }

  /* Reference values, listed under the chart. Without these you can see a dot and
     a name but have to eyeball its coordinates off the gridlines — which makes the
     guess a vibe rather than an inference. Stating them turns it into reasoning.
     A list rather than a hover tooltip on the dots, because the dots deliberately
     have pointer-events:none (so they don't swallow drags) and hover doesn't
     exist on touch anyway. */
  .legend{ display:flex; flex-wrap:wrap; gap:5px 16px; font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft); margin:0 0 14px; }
  .legend span{ white-space:nowrap; }
  .legend i{ display:inline-block; width:8px; height:8px; border-radius:50%; border:1.5px solid var(--ink); background:var(--paper); margin-right:6px; vertical-align:baseline; }
  .legend b{ color:var(--ink); font-weight:600; }

  /* The action bar pins the readout and the submit button to the bottom of the
     viewport whenever the panel is taller than the screen. Previously, on a 390x664
     phone, the submit button sat at y=649-700 and the reveal that followed it started
     at y=670 — so the player tapped a button they had to hunt for, and the score, the
     miss and the fact all rendered off the bottom of the screen with no cue. Sticky
     costs nothing on desktop (it only engages once the page actually scrolls) and
     means the action is always in reach. The reveal is rendered ABOVE this bar, so
     the score lands directly where the thumb already is. */
  .actionbar{
    position:sticky; bottom:0; z-index:5;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    background:var(--paper); border-top:2px dashed var(--line);
    margin:14px calc(var(--panel-pad) * -1) calc(var(--panel-pad) * -1);
    padding:12px var(--panel-pad) calc(12px + env(safe-area-inset-bottom, 0px));
  }
  .actionbar .readout{ flex:1 1 auto; min-width:0; }
  .actionbar button.primary{ flex:none; }
  .readout{ font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--guess); text-align:left; min-height:18px; }

  /* Reveal "juice", ported from guesstimate-slider-legacy.html: the target marker
     bounce-drops in, and the verdict row pulses (great guess) or shakes (bad
     guess). Respects prefers-reduced-motion — see the override below. */
  @keyframes targetDrop{ 0%{ transform:scale(0.3); opacity:0; } 60%{ transform:scale(1.25); opacity:1; } 100%{ transform:scale(1); opacity:1; } }
  @keyframes pulseGlow{ 0%{ box-shadow:0 0 0 0 rgba(var(--good-rgb),0.5); } 100%{ box-shadow:0 0 0 16px rgba(var(--good-rgb),0); } }
  @keyframes shakeBad{ 0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-6px); } 40%{ transform:translateX(6px); } 60%{ transform:translateX(-4px); } 80%{ transform:translateX(4px); } }
  @keyframes coachPulse{ 0%{ transform:scale(0.75); opacity:0.9; } 70%{ transform:scale(1.6); opacity:0; } 100%{ transform:scale(1.6); opacity:0; } }
  .target-marker{ transform-box:fill-box; transform-origin:center; animation:targetDrop .5s cubic-bezier(.3,1.5,.4,1) both; }
  .verdict-row.tier-perfect{ animation:pulseGlow 0.9s ease-out; border-radius:8px; }
  .reveal.tier-bad{ animation:shakeBad 0.4s ease-in-out; }
  .coach-ring{ transform-box:fill-box; transform-origin:center; animation:coachPulse 1.9s ease-out infinite; }
  @media (prefers-reduced-motion: reduce){
    .target-marker, .verdict-row.tier-perfect, .reveal.tier-bad, .coach-ring{ animation:none !important; }
    .coach-ring{ opacity:0.55; }
  }

  .reveal{ margin-top:6px; padding-top:16px; border-top:2px dashed var(--line); }
  .verdict-row{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:6px; }
  .verdict-row .pts{ font-family:'Fraunces',serif; font-weight:900; font-size:26px; white-space:nowrap; }
  /* The score used to be separated from the tier label by an em dash — "Way off —
     +27" — which sits immediately before the plus and reads as a minus sign at a
     glance. Every score in this game is a gain, so nothing here should ever look
     negative. Spacing does the separating instead. */
  .verdict-row .pts-num{ margin-left:0.4em; }
  .verdict-row .compare{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft); text-align:right; line-height:1.5; }
  .verdict-row .compare .miss{ color:var(--guess); }

  /* The fact is the actual product — it's the only thing in this genre that
     teaches you something, and it was previously rendered at 13.5px in muted grey
     below the fold. Give it the weight it earns. */
  .fact-block{ margin:14px 0 16px; border-left:3px solid var(--accent); padding-left:13px; }
  .fact-label{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:5px; }
  .fact{ color:var(--ink); line-height:1.6; font-size:14.5px; margin:0; }
  .fact-source{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-faint); margin:8px 0 0; }

  .next-row{ display:flex; justify-content:flex-end; gap:10px; align-items:center; flex-wrap:wrap; }
  .note{ font-size:12px; color:var(--ink-faint); margin-top:22px; line-height:1.6; }
  .pill{ font-family:'IBM Plex Mono',monospace; font-size:12px; border:2px solid var(--ink); border-radius:20px; padding:5px 10px; }
  .streak-line{ font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--ink-soft); text-align:center; margin-bottom:16px; }
  .streak-line b{ color:var(--ink); font-family:'Fraunces',serif; font-size:16px; }
  .error-text{ color:var(--bad); }
  .challenge-banner{ font-family:'IBM Plex Mono',monospace; font-size:13px; line-height:1.55; background:color-mix(in srgb, var(--accent) 18%, var(--paper)); border:2px solid var(--ink); border-radius:4px; padding:10px 12px; margin-bottom:16px; }
  .challenge-box{ margin-top:18px; padding-top:16px; border-top:2px dashed var(--line); text-align:left; }
  .challenge-box label{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-faint); display:block; margin-bottom:6px; }
  .challenge-box input{ width:100%; font-family:'Work Sans',sans-serif; font-size:14px; padding:9px 10px; border:2px solid var(--ink); border-radius:3px; background:var(--paper); color:var(--ink); margin-bottom:10px; }
  .challenge-box input::placeholder{ color:var(--ink-faint); }

  /* The shareable artifact. Wordle's emoji grid isn't decoration — it's the
     growth engine: spoiler-free, instantly parseable in a message thread, and it
     invites a reply in a way a bare number never does. Shown here too, because
     people like seeing the thing they're about to send. */
  .share-card{ font-family:'IBM Plex Mono',monospace; background:var(--paper-2); border:2px solid var(--ink); border-radius:4px; padding:12px 14px; margin:16px 0 4px; text-align:left; }
  .share-card .sc-head{ font-size:12px; color:var(--ink-soft); letter-spacing:0.05em; margin-bottom:6px; }
  .share-card .sc-strip{ font-size:22px; letter-spacing:3px; line-height:1.3; }
  .share-card .sc-score{ font-size:13px; color:var(--ink-soft); margin-top:4px; }

  .recap{ margin-top:18px; padding-top:14px; border-top:2px dashed var(--line); text-align:left; }
  .recap-head{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:8px; }
  .recap-row{ border-bottom:1px solid var(--line); }
  .recap-row:last-child{ border-bottom:none; }
  .recap-row summary{ display:flex; align-items:baseline; gap:9px; cursor:pointer; padding:9px 2px; list-style:none; font-family:'IBM Plex Mono',monospace; font-size:12.5px; }
  .recap-row summary::-webkit-details-marker{ display:none; }
  .recap-row summary::after{ content:'+'; margin-left:auto; color:var(--ink-faint); font-weight:600; }
  .recap-row[open] summary::after{ content:'–'; }
  .rc-emoji{ flex:none; }
  .rc-who{ color:var(--ink); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rc-pts{ font-weight:600; flex:none; }
  .rc-body{ padding:0 2px 12px; }
  .rc-line{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft); line-height:1.6; }
  .rc-fact{ font-size:13.5px; line-height:1.6; color:var(--ink); margin:8px 0 0; border-left:3px solid var(--accent); padding-left:11px; }

  /* Concentric score bands drawn around the answer on reveal — the literal heat map.
     They show the player which band they landed in and how much room each one had,
     which is the only place the scoring model is ever explained. Faded in rather than
     popped so they read as background, not as another marker. */
  @keyframes heatIn{ from{ opacity:0; } to{ opacity:1; } }
  .heat{ animation:heatIn .45s ease-out both; }
  @media (prefers-reduced-motion: reduce){ .heat{ animation:none !important; } }
  .heat-key{ display:flex; flex-wrap:wrap; gap:3px 12px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-faint); margin:10px 0 0; }
  .heat-key span{ white-space:nowrap; }

  /* Phone layout. The old header stack (a 3-line Fraunces prompt plus a 3-line mono
     instruction) pushed the chart down to y=296 on a 390x664 screen — 45% of the
     viewport spent before the game started. */
  @media (max-width: 560px){
    :root{ --panel-pad: 18px; }
    body{ padding:14px 12px; align-items:flex-start; }
    .topline{ font-size:11px; letter-spacing:0.04em; }
    .prompt{ font-size:17px; line-height:1.25; }
    .instructions{ font-size:11px; margin-bottom:10px; }

<body>
<div class="app" id="app">
  <div class="topline">
    <button id="topLeft" class="home-btn" title="Back to the home screen">GUESSTIMATE</button>
    <span class="topline-end">

    </span>

  <p class="note">Every number here is a real, verified career or season stat, cited on each reveal. The hollow dots are reference players with their values listed — you're estimating where the named player falls against them.</p>
</div>

<dialog class="modal" id="howModal" aria-labelledby="howTitle">
  <div class="modal-head">
    <h2 id="howTitle">How to play</h2>
    <button class="icon-btn" id="howClose" aria-label="Close">✕</button>

    <h2 id="statsTitle">Your stats</h2>
    <button class="icon-btn" id="statsClose" aria-label="Close stats">✕</button>
  </div>
  <div id="statsBody"></div>
