# Runs the gates that already exist, on every push and pull request.
#
# WHY THIS IS WORTH HAVING
# The repo has four browser suites, a fairness audit and a schema check, and until
# now every one of them ran only when somebody remembered to run it. A pull request
# that broke the game, corrupted a stat or re-introduced the free-points scoring bug
# would have shown a clean green page, because nothing was looking.
#
# WHAT IS DELIBERATELY NOT HERE
# verify_questions.py re-derives all 1,552 values from the raw datasets, which are
# ~43 MB and gitignored. Downloading them on every push would make this slow and
# would depend on third-party hosts staying up, so that check stays local and is run
# when content changes. It is the most important gate in the project, so its absence
# here is a real gap rather than an oversight — see the content workflow in
# handoff/content/README.md.
#
# THIS FILE ALSO DEPLOYS THE WORKER, AND THAT IS THE POINT
# Cloudflare's own Workers Builds triggers on push and never consults this workflow,
# so every gate above could fail and the API would deploy anyway. Deploying from here
# instead makes the gates load-bearing: `needs: gates` means a commit that breaks a
# question, the fairness curve or the game cannot reach players.
#
# It also puts the deploy configuration in the repository, where it is reviewable in
# a pull request. The failure that motivated this took an evening to find because the
# real configuration lived in a dashboard: the "Root directory" field read
# `handoff/worker`, which looks like the fix and does nothing for the deploy step —
# wrangler ran in the repository root, found no wrangler.toml, and reported a missing
# entry point. The `-c` flag below cannot be misread that way.
name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Question schema
        run: python3 handoff/pipeline/import_questions.py --check

      # Does every question still reward knowing the answer? This is the check that
      # caught two shipped questions paying better for a blind guess than for
      # knowledge, and neither looked wrong in review.
      - name: Fairness gate
        run: node handoff/pipeline/audit_fairness.mjs

      # Also asserts the pool is never published as a static file and that the game
      # and the Worker agree on BAG_EPOCH.
      - name: Build the site
        # These flags must match the ones DEPLOY.md tells you to deploy with, or the
        # next step compares the committed site against a build it never came from.
        run: >
          python3 handoff/pipeline/build_site.py --url https://statmap.app
          --analytics umami --analytics-domain 3acb4aa9-ff47-4133-8bad-a14e592a0ebb

      # The committed site/ must match what the sources produce. Without this, a
      # hand-edit to site/index.html survives — and site/ is what Pages actually
      # serves, so the deployed game would differ from its own source.
      - name: Committed build is up to date
        run: |
          if ! git diff --quiet -- site/; then
            echo "::error::site/ does not match a fresh build. Run build_site.py and commit the result."
            git diff --stat -- site/
            exit 1
          fi

      - name: Install Playwright
        working-directory: handoff
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Browser suites
        working-directory: handoff
        run: |
          node pipeline/devserver.mjs 8903 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8903/api/daily && break
            sleep 1
          done
          BASE=http://localhost:8903/ npm test

  # The pool is bundled INTO the Worker, so questions reach players when this job
  # runs and not when Pages rebuilds. A green site with a stale API is the failure
  # this project is most exposed to, because nothing about it looks broken.
  deploy-worker:
    needs: gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A missing token otherwise surfaces as a wrangler authentication error, which
      # reads like the token is wrong rather than absent.
      - name: Token is present
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set on this repository. Create a Cloudflare API token with the 'Edit Cloudflare Workers' template, then add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      # -c is not optional and not a style choice. Without it wrangler resolves its
      # config from the working directory, which here is the repository root, where
      # there is deliberately no wrangler.toml. `main` inside the config resolves
      # relative to the config file, so this builds byte-identically to running
      # wrangler from inside handoff/worker.
      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.124.0 deploy -c handoff/worker/wrangler.toml

      # Deploying is not the same as serving. This compares the pool fingerprint the
      # live API reports against the pool in this commit, and fails if they differ.
      # Without it, a Worker that uploads a version without releasing it passes every
      # check on this page: the deploy step succeeds, the API answers, the questions
      # are well-formed, and they are the previous ones.
      - name: The live API serves this commit's pool
        working-directory: handoff
        run: node pipeline/build_fingerprint.mjs --check
