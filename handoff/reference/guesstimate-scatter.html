<!-- Defense-in-depth per SECURITY_NOTES.md: this page now parses a URL param
     (?challenge=1&from=...&score=...) into the DOM. The param is sanitized in JS
     regardless, but a CSP costs nothing and would have blocked the earlier
     reflected-XSS bug documented there even before the code-level fix existed. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; base-uri 'none'; object-src 'none'; form-action 'self';">
<title>Guesstimate — Scatter Prototype</title>
<script>
// Applied synchronously, before CSS paints, so a returning player with a saved
// dark-mode preference doesn't see a flash of the light theme first.
(function(){
  try{
    var t = localStorage.getItem('guesstimate_theme');
    if(t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>

<style>
  :root{
    --paper: #f2efe4; --paper-2: #e9e4d4;
    --ink: #1b1810; --ink-rgb: 27,24,16; --ink-soft: #55503f; --ink-faint: #5f5946;
    --line: rgba(27,24,16,0.18);
    --accent: #f0b429;
    --good: #1e6a41; --good-rgb: 30,106,65; --good-bg: #e4f3ea;

  }

     (unless they've explicitly picked light via the toggle), and always applies
     once data-theme="dark" is set explicitly. Mostly a straight paper/ink swap
     to keep the same retro-paper look; good/mid/bad/guess get brightened a touch
     since the muted light-mode versions read as too dark against a dark page. */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper: #17140f; --paper-2: #211d16;
      --ink: #f2ede0; --ink-rgb: 242,237,224; --ink-soft: #cfc8b8; --ink-faint: #a39c8a;
      --line: rgba(242,237,224,0.18);
      --good: #3ddc84; --good-rgb: 61,220,132; --good-bg: rgba(61,220,132,0.15);

  :root[data-theme="dark"]{

  }
  *{box-sizing:border-box;}
  body{

    color:var(--ink); font-family:'Work Sans', sans-serif;
    display:flex; align-items:center; justify-content:center; padding:5vh 5vw;
  }
  .theme-toggle{
    position:fixed; top:16px; right:16px; z-index:10;
    width:38px; height:38px; display:flex; align-items:center; justify-content:center;

  .progress .seg.active{ background:var(--accent); }
  .panel{
    background:var(--paper); border:2.5px solid var(--ink); border-radius:3px;

  }

  p.sub{ color:var(--ink-soft); margin:0 0 18px; line-height:1.5; font-size:14.5px; }
  button.primary{
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:14px; letter-spacing:0.03em;
    background:var(--ink); color:var(--paper); border:2px solid var(--ink); border-radius:3px;
    padding:12px 22px; cursor:pointer; box-shadow:4px 4px 0 rgba(var(--ink-rgb),0.35);

  .league-tag{ display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.08em; background:var(--accent); color:#4d3a06; padding:3px 9px; border:1.5px solid var(--ink); margin-bottom:10px; }
  .prompt{ font-family:'Fraunces',serif; font-weight:600; font-size:21px; line-height:1.3; margin-bottom:4px; }
  .prompt .player{ color:var(--guess); }
  .instructions{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-faint); margin-bottom:14px; }

  .chart-frame{
    background:color-mix(in srgb, var(--accent) 12%, var(--paper));
    border:2.5px solid var(--ink); border-radius:3px; padding:6px;
    margin-bottom:16px; position:relative; touch-action:none;
  }
  .chart-frame svg{ width:100%; height:auto; display:block; cursor:crosshair; touch-action:none; }
  .chart-frame svg rect[tabindex]:focus-visible{ outline:3px solid var(--ink); outline-offset:-3px; }

  .readout{ font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--guess); text-align:center; margin-bottom:14px; min-height:18px; }

  /* Reveal "juice", ported from guesstimate-slider-legacy.html: the target marker
     bounce-drops in, and the verdict row pulses (great guess) or shakes (bad
     guess). Respects prefers-reduced-motion — see the override below. */
  @keyframes targetDrop{ 0%{ transform:scale(0.3); opacity:0; } 60%{ transform:scale(1.25); opacity:1; } 100%{ transform:scale(1); opacity:1; } }
  @keyframes pulseGlow{ 0%{ box-shadow:0 0 0 0 rgba(var(--good-rgb),0.5); } 100%{ box-shadow:0 0 0 16px rgba(var(--good-rgb),0); } }
  @keyframes shakeBad{ 0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-6px); } 40%{ transform:translateX(6px); } 60%{ transform:translateX(-4px); } 80%{ transform:translateX(4px); } }
  .target-marker{ transform-box:fill-box; transform-origin:center; animation:targetDrop .5s cubic-bezier(.3,1.5,.4,1) both; }
  .verdict-row.tier-perfect{ animation:pulseGlow 0.9s ease-out; border-radius:8px; }
  .reveal.tier-bad{ animation:shakeBad 0.4s ease-in-out; }
  @media (prefers-reduced-motion: reduce){
    .target-marker, .verdict-row.tier-perfect, .reveal.tier-bad{ animation:none !important; }
  }

  .reveal{ margin-top:6px; padding-top:16px; border-top:2px dashed var(--line); }
  .verdict-row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .verdict-row .pts{ font-family:'Fraunces',serif; font-weight:900; font-size:26px; }
  .verdict-row .pts.good{ color:var(--good); } .verdict-row .pts.mid{ color:var(--mid); } .verdict-row .pts.bad{ color:var(--bad); }
  .verdict-row .compare{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft); text-align:right; }
  .fact{ color:var(--ink-soft); line-height:1.55; font-size:13.5px; margin:12px 0 16px; }
  .next-row{ display:flex; justify-content:flex-end; }
  .note{ font-size:12px; color:var(--ink-faint); margin-top:22px; line-height:1.6; }
  .pill{ font-family:'IBM Plex Mono',monospace; font-size:12px; border:2px solid var(--ink); border-radius:20px; padding:5px 10px; }
  .streak-line{ font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--ink-soft); text-align:center; margin-bottom:16px; }
  .streak-line b{ color:var(--ink); font-family:'Fraunces',serif; font-size:16px; }
  .error-text{ color:var(--bad); }
  .challenge-banner{ font-family:'IBM Plex Mono',monospace; font-size:13px; background:color-mix(in srgb, var(--accent) 18%, var(--paper)); border:2px solid var(--ink); border-radius:4px; padding:10px 12px; margin-bottom:16px; }
  .challenge-box{ margin-top:18px; padding-top:16px; border-top:2px dashed var(--line); text-align:left; }
  .challenge-box label{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-faint); display:block; margin-bottom:6px; }
  .challenge-box input{ width:100%; font-family:'Work Sans',sans-serif; font-size:14px; padding:9px 10px; border:2px solid var(--ink); border-radius:3px; background:var(--paper); color:var(--ink); margin-bottom:10px; }
  .challenge-box input::placeholder{ color:var(--ink-faint); }
</style>

<body>
<button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">☾</button>
<div class="app">
  <div class="topline">
    <span>GUESSTIMATE — SCATTER</span>
    <span id="topRight">···</span>
  </div>
  <div class="progress" id="progress"></div>
  <div class="panel" id="panel"></div>
  <p class="note">Prototype of the click-to-plot 2D mechanic — real reference players are plotted on both axes at once, and you click where you think the named player falls. All five data points (four references + LeBron's real career line) are verified NBA career averages.</p>
</div>

<script>
/* ============================= UNTRUSTED INPUT (challenge links) =============================
   Anything arriving via a URL parameter is untrusted the moment it's going to touch
   the DOM — see SECURITY_NOTES.md, which documents a real reflected-XSS bug from
   exactly this pattern (a challenge link's `from` name interpolated unescaped). The
   fix there was to sanitize once, at the point of parsing, rather than case-by-case
   at each downstream usage site — that's what this block does, before anything else
   in the app runs. escapeHtml is applied again at the actual render call below, as
   belt-and-suspenders on top of the whitelist here. */
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
function sanitizeName(raw){
  if(!raw) return '';
  return raw.replace(/[^a-zA-Z0-9 '\-]/g, '').trim().slice(0, 30);
}
function clampScore(raw, max){
  const n = parseInt(raw, 10);
  if(!Number.isFinite(n)) return null;
  return Math.max(0, Math.min(max, n));
}
// Generous fixed cap rather than tying it to today's pool size — the sender's max
// possible score (the day they played) may not match the recipient's (today), since
// the pool keeps growing.
const CHALLENGE_MAX_SCORE = 5000;
const challengeParams = new URLSearchParams(location.search);
const CHALLENGE = challengeParams.get('challenge') === '1' ? {
  active: true,
  from: sanitizeName(challengeParams.get('from') || ''),
  score: clampScore(challengeParams.get('score'), CHALLENGE_MAX_SCORE),
} : { active: false };

/* ============================= DATA LOADING =============================
   Question content lives in ../data/questions.json (the canonical schema — see
   README.md and CONTENT_BACKLOG.md) and is loaded at runtime instead of being
   hardcoded here, so content edits never require touching this file or risk a
   hardcoded copy drifting out of sync with the source of truth. */
let QUESTION_POOL = [];
let TODAY = '';
let ROUNDS = [];

/* ============================= DAILY SELECTION (pure — portable to a server later) =============================
   Ported unchanged from guesstimate-slider-legacy.html — already built and tested
   there. Given a date string and the question pool, deterministically picks
   today's questions: same date always produces the same result, so it doesn't
   matter where this runs (browser today, an API later). Selecting the *full* pool
   for now (see the selectDailyQuestions call in init() below) rather than a
   5-question subset — there are only 4 verified questions so far, not enough to
   meaningfully sample from; the function already supports a smaller count once
   the pool grows (see ACTION_PLAN.md v1.1). */
function hashString(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (Math.imul(31,h) + str.charCodeAt(i)) | 0; }
  return h >>> 0;
}
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, seed){
  const rng = mulberry32(seed);
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
// Fixed reference timezone so every player gets the same "today" regardless of
// their own — otherwise players in different timezones could be on different
// calendar days at the same real-world moment.
function todayDateString(tz='America/New_York'){
  return new Date().toLocaleDateString('en-CA', { timeZone: tz }); // e.g. "2026-08-05"
}
function selectDailyQuestions(dateStr, pool, count=5){
  const seed = hashString(dateStr);
  return seededShuffle(pool, seed).slice(0, Math.min(count, pool.length));
}

// Shuffled-bag anti-repeat rotation (ACTION_PLAN.md v1.1 trigger: the pool is now
// large enough that daily repeats would be noticeable). Concatenate independently
// -shuffled copies of the pool end-to-end ("cycle 0", "cycle 1", ...) into one
// infinite sequence, then hand out `count` consecutive items per calendar day.
// Every item in the pool appears exactly once before any item repeats — a fresh
// reshuffle only happens once the whole pool has been exhausted — and it's still a
// pure function of (dateStr, pool, count): no stored cursor, nothing to desync.
const BAG_EPOCH = '2026-01-01'; // fixed origin so day numbering never shifts across sessions
function daysSince(dateStr, epoch){
  return Math.floor((Date.parse(dateStr + 'T00:00:00Z') - Date.parse(epoch + 'T00:00:00Z')) / 86400000);
}
function selectDailyBag(dateStr, pool, count=5){
  if(pool.length === 0) return [];
  const dayIndex = Math.max(0, daysSince(dateStr, BAG_EPOCH));
  const startIdx = dayIndex * count;
  const cycleShuffles = new Map();
  const result = [];
  for(let i = startIdx; i < startIdx + count; i++){
    const cycleIndex = Math.floor(i / pool.length);
    const posInCycle = i % pool.length;
    if(!cycleShuffles.has(cycleIndex)){
      cycleShuffles.set(cycleIndex, seededShuffle(pool, hashString(`bag-cycle-${cycleIndex}`)));
    }
    result.push(cycleShuffles.get(cycleIndex)[posInCycle]);
  }
  return result;
}

/* ============================= STREAK (ported unchanged from guesstimate-slider-legacy.html) ============================= */
const STATS_KEY = 'guesstimate_stats_v1';
function loadStats(){ try{ return JSON.parse(localStorage.getItem(STATS_KEY)) || {lastPlayed:null,currentStreak:0,bestStreak:0}; }catch(e){ return {lastPlayed:null,currentStreak:0,bestStreak:0}; } }
function saveStats(s){ try{ localStorage.setItem(STATS_KEY, JSON.stringify(s)); }catch(e){} }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function registerCompletion(){
  const s = loadStats(); const today = todayISO();
  if(s.lastPlayed === today) return s;
  const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
  s.currentStreak = (s.lastPlayed===yesterday) ? s.currentStreak+1 : 1;
  s.bestStreak = Math.max(s.bestStreak||0, s.currentStreak);
  s.lastPlayed = today; saveStats(s); return s;
}

/* ============================= SCORING (same exponential model, extended to 2D) ============================= */
// Distance is computed in normalized chart-space (0-1 on each axis, based on the
// plotted range) rather than raw stat units, so PPG and RPG — different scales —
// contribute fairly to the single error number. Same HALF_LIFE decay curve as the
// core game, just fed a 2D distance instead of a 1D one.
const HALF_LIFE = 25;
function scoreGuess2D(gx, gy, tx, ty, xRange, yRange){
  const ndx = (gx - tx) / xRange;
  const ndy = (gy - ty) / yRange;
  const errorPct = Math.sqrt(ndx*ndx + ndy*ndy) * 100;
  return { points: Math.round(100 * Math.pow(0.5, errorPct / HALF_LIFE)), errorPct };
}
function scoreTier(points){
  if(points >= 100) return { emoji:'🟢', label:'Perfect' };
  if(points >= 90)  return { emoji:'🟢', label:'Great' };
  if(points >= 50)  return { emoji:'🟡', label:'Ballpark' };
  if(points >= 1)   return { emoji:'🔴', label:'Off' };
  return { emoji:'⚫', label:'Way off' };
}

/* ============================= RENDER ============================= */
const panel = document.getElementById('panel');
const topRight = document.getElementById('topRight');
const progressEl = document.getElementById('progress');
const SVGNS = 'http://www.w3.org/2000/svg';
function el(tag, attrs={}){ const n=document.createElementNS(SVGNS, tag); for(const k in attrs) n.setAttribute(k, attrs[k]); return n; }
// Chart labels show the full name rather than abbreviating to a last name — a
// last-name-only label is ambiguous the moment two reference players in the same
// question share a surname (this pool already has both Michael Jordan and DeAndre
// Jordan), and that only gets more likely as the player pool grows toward 500.
// Still strip a trailing season year from target players written like "Jonathan
// Taylor, 2021" — that's identifying a season, not a person, and the prompt text
// above the chart already states it.
function shortLabel(name){
  return name.replace(/,?\s*\d{4}$/, '') || name;
}

// Guess-snapping precision. A fixed "round to nearest 0.1" (the old behavior)
// is wrong the moment a stat's whole meaningful range is itself close to 0.1 —
// batting average (.236-.342) is the case that broke it: nearly the entire
// chart collapsed onto two clickable values. Each question can declare xStep/
// yStep explicitly (e.g. 1 for a stat that's only ever a whole number, like an
// All-Star count or a home run total; 0.001 for batting average); anything that
// doesn't is assumed to be a normal one-decimal per-game rate stat, matching
// every question built before this existed.
const DEFAULT_STEP = 0.1;
function stepDecimals(step){
  if(step >= 1) return 0;
  return Math.max(0, -Math.floor(Math.log10(step)));
}
function roundToStep(v, step){
  const decimals = stepDecimals(step);
  return Number((Math.round(v/step)*step).toFixed(decimals));
}

let idx = 0;
let roundScores = [];

function renderProgress(){
  progressEl.innerHTML = '';
  ROUNDS.forEach((_,i)=>{
    const seg = document.createElement('div');
    seg.className = 'seg' + (i<idx?' done':'') + (i===idx?' active':'');
    progressEl.appendChild(seg);
  });
}

function startScreen(){
  topRight.textContent = `${ROUNDS.length} QUESTIONS`;
  progressEl.innerHTML = '';
  const stats = loadStats();
  const streakHTML = stats.currentStreak>0 ? `<div class="streak-line">🔥 <b>${stats.currentStreak}</b>-day streak · best: <b>${stats.bestStreak}</b></div>` : '';
  const challengeHTML = CHALLENGE.active
    ? `<div class="challenge-banner">🎯 <b>${escapeHtml(CHALLENGE.from || 'A friend')}</b> scored <b>${CHALLENGE.score ?? '?'}</b> — think you can beat them?</div>`
    : '';
  panel.innerHTML = `
    <h1 class="title">Guesstimate</h1>
    <p class="sub">Real reference players are plotted on a 2D chart — click where you think the named player falls on both stats at once.</p>
    <p class="instructions" style="margin-bottom:16px;">Today: ${TODAY} — same ${ROUNDS.length} question${ROUNDS.length===1?'':'s'} for everyone, in this order, until midnight ET.</p>
    ${challengeHTML}
    ${streakHTML}
    <div class="next-row"><button class="primary" id="startBtn">Start today's ${ROUNDS.length===1?'question':'questions'} →</button></div>
  `;
  document.getElementById('startBtn').addEventListener('click', ()=>{ idx=0; roundScores=[]; showQuestion(); });
}

function showQuestion(){
  topRight.textContent = `${idx+1} / ${ROUNDS.length}`;
  renderProgress();
  const r = ROUNDS[idx];
  const allX = [r.targetX, ...r.referencePlayers.map(p=>p.x)];
  const allY = [r.targetY, ...r.referencePlayers.map(p=>p.y)];
  const xMin = Math.min(...allX)*0.7, xMax = Math.max(...allX)*1.15;
  const yMin = Math.min(...allY)*0.5, yMax = Math.max(...allY)*1.2;
  const xStep = r.xStep || DEFAULT_STEP, yStep = r.yStep || DEFAULT_STEP;
  const xDecimals = stepDecimals(xStep), yDecimals = stepDecimals(yStep);
  const W = 560, H = 420, padL = 54, padR = 20, padT = 20, padB = 44;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const xPix = (v)=> padL + ((v-xMin)/(xMax-xMin))*plotW;
  const yPix = (v)=> padT + plotH - ((v-yMin)/(yMax-yMin))*plotH;
  const xVal = (px)=> xMin + ((px-padL)/plotW)*(xMax-xMin);
  const yVal = (py)=> yMin + ((padT+plotH-py)/plotH)*(yMax-yMin);

  panel.innerHTML = `
    <div class="league-tag">${r.league}</div>
    <div class="prompt">${r.xLabel} vs. ${r.yLabel}<br>— <span class="player">${r.targetPlayer}</span></div>
    <div class="instructions">Click or drag to plot where you think ${r.targetPlayer} falls on both stats at once — or tab in and use the arrow keys</div>
    <div class="chart-frame"><svg id="chartSvg" viewBox="0 0 ${W} ${H}"></svg></div>
    <div class="readout" id="readout" aria-live="polite">Click the chart to place your guess</div>
    <div class="next-row"><button class="primary" id="submitBtn" disabled>Submit guess</button></div>
    <div id="revealArea"></div>
  `;

  const svg = document.getElementById('chartSvg');
  const readout = document.getElementById('readout');
  const submitBtn = document.getElementById('submitBtn');
  let guess = null;
  let answered = false;
  let guessEl = null;
  let guideXEl = null, guideYEl = null;

  // Takes a position already in data space (stat units, not pixels) and applies
  // it as the current guess: updates the readout live, and updates (or creates)
  // the guess marker plus its dashed guide lines to both axes, so the player can
  // calibrate precisely against the gridlines and reference dots while dragging
  // or nudging with arrow keys — not just see the result after letting go.
  // Mutates existing elements in place rather than tearing down and rebuilding
  // the whole chart on every move, which would be janky at drag speed.
  function applyGuess(gx, gy){
    gx = Math.max(xMin, Math.min(xMax, gx));
    gy = Math.max(yMin, Math.min(yMax, gy));
    guess = { x: roundToStep(gx, xStep), y: roundToStep(gy, yStep) };
    readout.innerHTML = `Your guess: <b>${guess.x} ${r.xUnit}</b>, <b>${guess.y} ${r.yUnit}</b>`;
    submitBtn.disabled = false;
    const gxPix = xPix(guess.x), gyPix = yPix(guess.y);

    if(!guideXEl){
      guideXEl = el('line',{stroke:'var(--guess)','stroke-width':1.5,'stroke-dasharray':'4 4','stroke-opacity':0.55, style:'pointer-events:none;'});
      svg.appendChild(guideXEl);
    }
    guideXEl.setAttribute('x1', gxPix); guideXEl.setAttribute('x2', gxPix);
    guideXEl.setAttribute('y1', gyPix); guideXEl.setAttribute('y2', padT+plotH);

    if(!guideYEl){
      guideYEl = el('line',{stroke:'var(--guess)','stroke-width':1.5,'stroke-dasharray':'4 4','stroke-opacity':0.55, style:'pointer-events:none;'});
      svg.appendChild(guideYEl);
    }
    guideYEl.setAttribute('x1', padL); guideYEl.setAttribute('x2', gxPix);
    guideYEl.setAttribute('y1', gyPix); guideYEl.setAttribute('y2', gyPix);

    if(guessEl){
      guessEl.setAttribute('cx', gxPix);
      guessEl.setAttribute('cy', gyPix);
    } else {
      guessEl = el('circle',{cx:gxPix,cy:gyPix,r:9, fill:'var(--guess)', stroke:'var(--ink)','stroke-width':2.5, style:'pointer-events:none;'});
      svg.appendChild(guessEl);
    }
  }

  // Pointer coordinates (client pixels) -> data space, then hands off to applyGuess.
  function placeGuess(clientX, clientY){
    const rect = svg.getBoundingClientRect();
    const scaleX = W/rect.width, scaleY = H/rect.height;
    const px = (clientX - rect.left)*scaleX, py = (clientY - rect.top)*scaleY;
    applyGuess(xVal(px), yVal(py));
  }

  function draw(){
    svg.innerHTML = '';
    // svg just got wiped, so any prior element references are stale
    guessEl = null; guideXEl = null; guideYEl = null;
    svg.appendChild(el('line',{x1:padL,y1:padT,x2:padL,y2:padT+plotH, stroke:'var(--ink)','stroke-width':2}));
    svg.appendChild(el('line',{x1:padL,y1:padT+plotH,x2:padL+plotW,y2:padT+plotH, stroke:'var(--ink)','stroke-width':2}));
    for(let i=0;i<=4;i++){
      const xv = xMin + (i/4)*(xMax-xMin);
      const px = xPix(xv);
      svg.appendChild(el('line',{x1:px,y1:padT,x2:px,y2:padT+plotH, stroke:'var(--ink)','stroke-opacity':0.08,'stroke-width':1}));
      const t = el('text',{x:px,y:padT+plotH+18,'text-anchor':'middle','font-size':10.5, fill:'var(--ink)','fill-opacity':0.85, class:'mono', style:'pointer-events:none;'}); t.textContent = xv.toFixed(xDecimals); svg.appendChild(t);
    }
    for(let i=0;i<=4;i++){
      const yv = yMin + (i/4)*(yMax-yMin);
      const py = yPix(yv);
      svg.appendChild(el('line',{x1:padL,y1:py,x2:padL+plotW,y2:py, stroke:'var(--ink)','stroke-opacity':0.08,'stroke-width':1}));
      const t = el('text',{x:padL-8,y:py+4,'text-anchor':'end','font-size':10.5, fill:'var(--ink)','fill-opacity':0.85, class:'mono', style:'pointer-events:none;'}); t.textContent = yv.toFixed(yDecimals); svg.appendChild(t);
    }
    const xl = el('text',{x:padL+plotW/2,y:H-6,'text-anchor':'middle','font-size':11, fill:'var(--ink)','fill-opacity':0.95, class:'mono', style:'pointer-events:none;'}); xl.textContent = `${r.xLabel} (${r.xUnit}) →`; svg.appendChild(xl);
    const yl = el('text',{x:14,y:padT+plotH/2,'text-anchor':'middle','font-size':11, fill:'var(--ink)','fill-opacity':0.95, class:'mono', style:'pointer-events:none;', transform:`rotate(-90 14 ${padT+plotH/2})`}); yl.textContent = `↑ ${r.yLabel} (${r.yUnit})`; svg.appendChild(yl);

    // The hit rect already spans the full plot area (hundreds of CSS px on any
    // real screen), so the draggable target is far larger than the 44x44px
    // minimum touch target regardless of the drawn marker's small visual radius
    // — a touch can start a drag anywhere in the chart, not just precisely on
    // the existing pin.
    const hit = el('rect',{x:padL,y:padT,width:plotW,height:plotH, fill:'transparent', tabindex:'0', role:'application'});
    hit.setAttribute('aria-label', `${r.xLabel} versus ${r.yLabel} chart for ${r.targetPlayer}. Click or drag to place a guess. When focused, use the arrow keys to move it and Enter to submit.`);
    let dragging = false;
    hit.addEventListener('pointerdown', (e)=>{
      if(answered) return;
      dragging = true;
      try{ hit.setPointerCapture(e.pointerId); }catch(err){}
      placeGuess(e.clientX, e.clientY);
    });
    hit.addEventListener('pointermove', (e)=>{
      if(!dragging || answered) return;
      placeGuess(e.clientX, e.clientY);
    });
    hit.addEventListener('pointerup', (e)=>{
      if(dragging && navigator.vibrate) navigator.vibrate(12);
      dragging = false;
      try{ hit.releasePointerCapture(e.pointerId); }catch(err){}
    });
    hit.addEventListener('pointercancel', ()=>{ dragging = false; });
    // Keyboard path: tab to focus the chart, arrow keys nudge the guess one
    // step per press on each axis, Enter submits. Mirrors the pointer/drag
    // interaction rather than being a bolted-on separate mode.
    hit.addEventListener('keydown', (e)=>{
      if(answered) return;
      const dir = { ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,1], ArrowDown:[0,-1] }[e.key];
      if(dir){
        e.preventDefault();
        const baseX = guess ? guess.x : (xMin+xMax)/2;
        const baseY = guess ? guess.y : (yMin+yMax)/2;
        applyGuess(baseX + dir[0]*xStep, baseY + dir[1]*yStep);
      } else if(e.key === 'Enter' && guess){
        e.preventDefault();
        submitBtn.click();
      }
    });
    svg.appendChild(hit);

    r.referencePlayers.forEach((p,i)=>{
      const cx = xPix(p.x), cy = yPix(p.y);
      svg.appendChild(el('circle',{cx,cy,r:7, fill:'var(--paper)', stroke:'var(--ink)','stroke-width':2, style:'pointer-events:none;'}));
      const above = i%2===0;
      const t = el('text',{x:cx,y:above?cy-13:cy+22,'text-anchor':'middle','font-size':10.5, 'font-weight':600, fill:'var(--ink)', class:'mono', style:'pointer-events:none;'});
      t.textContent = shortLabel(p.name);
      svg.appendChild(t);
    });

    if(guess){
      const gx = xPix(guess.x), gy = yPix(guess.y);
      guessEl = el('circle',{cx:gx,cy:gy,r:9, fill:'var(--guess)', stroke:'var(--ink)','stroke-width':2.5, style:'pointer-events:none;'});
      svg.appendChild(guessEl);
    }
  }
  draw();

  submitBtn.addEventListener('click', ()=>{
    if(answered){
      idx++;
      if(idx>=ROUNDS.length) showResults(); else showQuestion();
      return;
    }
    if(!guess) return;
    answered = true;
    const xRange = xMax-xMin, yRange = yMax-yMin;
    const { points } = scoreGuess2D(guess.x, guess.y, r.targetX, r.targetY, xRange, yRange);
    roundScores.push(points);
    const t = scoreTier(points);
    const tierClass = points>=90?'good':points>=50?'mid':'bad';
    // Reveal "juice", ported from guesstimate-slider-legacy.html: a great guess
    // pulses, a bad one shakes. Same >=90/<25 thresholds as the legacy version.
    const tierAnimClass = points>=90 ? 'tier-perfect' : points<25 ? 'tier-bad' : '';

    const tx = xPix(r.targetX), ty = yPix(r.targetY);
    const connector = el('line',{x1:xPix(guess.x),y1:yPix(guess.y),x2:tx,y2:ty, stroke:'var(--ink)','stroke-width':1.5,'stroke-dasharray':'4 4'});
    svg.appendChild(connector);
    svg.appendChild(el('circle',{cx:tx,cy:ty,r:9, fill:'var(--good)', stroke:'var(--ink)','stroke-width':2.5, class:'target-marker'}));
    const targetLbl = el('text',{x:tx,y:ty-15,'text-anchor':'middle','font-size':11,'font-weight':700, fill:'var(--good)', class:'mono target-marker'});
    targetLbl.textContent = shortLabel(r.targetPlayer);
    svg.appendChild(targetLbl);

    document.getElementById('revealArea').innerHTML = `
      <div class="reveal ${tierAnimClass}">
        <div class="verdict-row ${tierAnimClass}">
          <div class="pts ${tierClass}">${t.emoji} ${t.label} — +${points}</div>
          <div class="compare">Actual: ${r.targetX} ${r.xUnit}, ${r.targetY} ${r.yUnit}</div>
        </div>
        <p class="fact">${r.fact}<br><span class="mono" style="font-size:11px;">${r.source}</span></p>
      </div>
    `;
    submitBtn.textContent = idx+1<ROUNDS.length ? 'Next question →' : 'See results →';
  });
}

function showResults(){
  topRight.textContent = 'RESULTS';
  renderProgress();
  const total = roundScores.reduce((a,b)=>a+b,0);
  const stats = registerCompletion();
  const pills = roundScores.map(s=>`<span class="pill">+${s}</span>`).join('');
  panel.innerHTML = `
    <div style="text-align:center;">
      <div class="topline" style="justify-content:center;">ROUND COMPLETE</div>
      <div style="font-family:'Fraunces',serif;font-weight:900;font-size:52px;margin:10px 0;">${total}<span style="font-size:22px;color:var(--ink-faint);font-weight:600;">/${ROUNDS.length*100}</span></div>
      <div style="display:flex;justify-content:center;gap:8px;margin:16px 0;flex-wrap:wrap;">${pills}</div>
      <div class="streak-line">🔥 <b>${stats.currentStreak}</b>-day streak · best: <b>${stats.bestStreak}</b></div>
      <button class="primary" id="againBtn">Play again</button>
    </div>
    <div class="challenge-box">
      <label for="challengeName">Your name (optional, shown to whoever you send this to)</label>
      <input type="text" id="challengeName" maxlength="30" placeholder="e.g. Drew">
      <div class="next-row"><button class="primary" id="shareBtn">Share your score</button></div>
      <p class="instructions" id="shareStatus" style="margin-top:8px;"></p>
    </div>
  `;
  document.getElementById('againBtn').addEventListener('click', ()=>{ idx=0; roundScores=[]; showQuestion(); });

  document.getElementById('shareBtn').addEventListener('click', async ()=>{
    const nameInput = document.getElementById('challengeName');
    const name = sanitizeName(nameInput ? nameInput.value : '');
    const url = new URL(location.href);
    url.search = '';
    url.searchParams.set('challenge', '1');
    if(name) url.searchParams.set('from', name);
    url.searchParams.set('score', String(total));
    const shareUrl = url.toString();
    const shareText = `Guesstimate — I scored ${total}/${ROUNDS.length*100}. Think you can beat me?`;
    const status = document.getElementById('shareStatus');

    if(navigator.share){
      try{
        await navigator.share({ title: 'Guesstimate', text: shareText, url: shareUrl });
        return;
      }catch(err){
        if(err && err.name === 'AbortError') return; // player closed the share sheet - not a failure
        // any other failure (e.g. share unsupported for this content) falls through to the clipboard below
      }
    }
    try{
      await navigator.clipboard.writeText(`${shareText} ${shareUrl}`);
      status.textContent = 'Copied! Paste it in Messages, or anywhere.';
    }catch(err){
      status.textContent = shareUrl;
    }
  });
}

/* ============================= INIT ============================= */
// Content lives in ../data/questions.json (see DATA LOADING comment above) — fetch
// it before anything else can render, and fail visibly rather than silently if it
// doesn't load, instead of leaving the page stuck on nothing.
async function init(){
  panel.innerHTML = `<p class="sub">Loading today's puzzle…</p>`;
  let pool;
  try{
    const res = await fetch('../data/questions.json');
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    pool = await res.json();
    if(!Array.isArray(pool) || pool.length === 0) throw new Error('empty question pool');
  }catch(err){
    panel.innerHTML = `<p class="sub error-text">Couldn't load today's questions (${err.message}). Try refreshing the page.</p>`;
    return;
  }
  QUESTION_POOL = pool;
  TODAY = todayDateString();
  // Shuffled-bag rotation: 5/day, no repeats until the whole pool has been shown
  // once (see selectDailyBag above). Falls back to the full pool on days it can't
  // fill a group of 5 yet (pool still under 5 questions).
  const DAILY_COUNT = 5;
  ROUNDS = QUESTION_POOL.length >= DAILY_COUNT
    ? selectDailyBag(TODAY, QUESTION_POOL, DAILY_COUNT)
    : selectDailyQuestions(TODAY, QUESTION_POOL, QUESTION_POOL.length);
  startScreen();
}
init();

/* ============================= THEME (light/dark) ============================= */
const THEME_KEY = 'guesstimate_theme';
function loadThemePref(){ try{ return localStorage.getItem(THEME_KEY); }catch(e){ return null; } }
function saveThemePref(t){ try{ localStorage.setItem(THEME_KEY, t); }catch(e){} }
function effectiveTheme(){
  const stored = loadThemePref();
  if(stored === 'light' || stored === 'dark') return stored;
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
function updateThemeToggleIcon(){
  const btn = document.getElementById('themeToggle');
  if(btn) btn.textContent = effectiveTheme() === 'dark' ? '☀' : '☾';
}
document.getElementById('themeToggle').addEventListener('click', ()=>{
  const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  saveThemePref(next);
  updateThemeToggleIcon();
});
updateThemeToggleIcon();
</script>
