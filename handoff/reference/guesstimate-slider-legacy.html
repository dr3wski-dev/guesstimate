<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guesstimate — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #f2efe4; --paper-2: #e9e4d4;
    --ink: #1b1810; --ink-soft: #55503f; --ink-faint: #5f5946;
    --line: rgba(27,24,16,0.18);
    --accent: #f0b429;
    --good: #1e6a41; --good-bg: #e4f3ea;
    --mid: #c88a00; --mid-bg: #faf1de;
    --bad: #b53a2e; --bad-bg: #fbe7e3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:var(--paper);
    background-image:repeating-linear-gradient(0deg, rgba(27,24,16,0.025) 0px, rgba(27,24,16,0.025) 1px, transparent 1px, transparent 3px);
    color:var(--ink); font-family:'Work Sans', sans-serif;
    display:flex; align-items:center; justify-content:center; padding:5vh 5vw;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  :focus-visible{ outline:3px solid var(--ink); outline-offset:3px; }
  .app{ width:100%; max-width:560px; }

  .topline{
    display:flex; justify-content:space-between; align-items:baseline;
    font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--ink-faint);
    letter-spacing:0.06em; text-transform:uppercase; margin-bottom:14px;
  }
  .progress{ display:flex; gap:6px; margin-bottom:22px; }
  .progress .seg{ flex:1; height:6px; background:var(--paper-2); border:1.5px solid var(--ink); }
  .progress .seg.done{ background:var(--ink); }
  .progress .seg.active{ background:var(--accent); }

  .panel{
    background:var(--paper); border:2.5px solid var(--ink); border-radius:3px;
    box-shadow:7px 7px 0 var(--ink); padding:26px;
  }

  h1.title{ font-family:'Fraunces',serif; font-weight:700; font-size:clamp(28px,5vw,40px); margin:0 0 8px; line-height:1.05; }
  p.sub{ color:var(--ink-soft); margin:0 0 22px; line-height:1.5; }

  button.primary{
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:14px; letter-spacing:0.03em;
    background:var(--ink); color:var(--paper); border:2px solid var(--ink); border-radius:3px;
    padding:12px 22px; cursor:pointer; box-shadow:4px 4px 0 rgba(27,24,16,0.35);
    transition:transform .15s ease;
  }
  button.primary:hover{ transform:translate(-2px,-2px); }
  button.primary:disabled{ opacity:0.4; cursor:default; }
  button.ghost{
    font-family:'IBM Plex Mono',monospace; font-size:13px; background:var(--paper);
    border:2px solid var(--ink); border-radius:3px; padding:11px 18px; cursor:pointer;
  }

  .chart-frame{
    background:color-mix(in srgb, var(--accent) 14%, var(--paper));
    border:2.5px solid var(--ink); border-radius:3px; padding:14px;
    margin-bottom:18px; height:170px;
  }
  .chart-frame svg{ width:100%; height:100%; overflow:visible; display:block; }

  .question{ font-size:16px; line-height:1.5; margin:0 0 8px; font-weight:500; }
  .range-hint{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-faint); margin:0 0 16px; }

  .guess-row{ display:flex; gap:10px; align-items:center; margin-bottom:4px; }
  .guess-row input{
    flex:1; font-family:'Fraunces',serif; font-weight:600; font-size:22px;
    padding:12px 14px; border:2.5px solid var(--ink); border-radius:3px; background:var(--paper);
    color:var(--ink); width:100%;
  }
  .guess-row .unit{ font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--ink-faint); min-width:70px; }

  .slider-wrap{ margin:14px 0 18px; }
  .slider-wrap input[type=range]{
    -webkit-appearance:none; appearance:none; width:100%; height:14px;
    background:linear-gradient(90deg, var(--ink) 0%, var(--ink) var(--fill,50%), var(--paper-2) var(--fill,50%), var(--paper-2) 100%);
    border:2px solid var(--ink); border-radius:10px; outline:none; cursor:pointer; touch-action:none;
  }
  .slider-wrap input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:30px; height:30px; border-radius:50%;
    background:var(--accent); border:3px solid var(--ink); cursor:grab; box-shadow:2px 2px 0 rgba(27,24,16,0.3);
    transition:transform .1s ease;
  }
  .slider-wrap input[type=range]:active::-webkit-slider-thumb{ cursor:grabbing; transform:scale(1.15); }
  .slider-wrap input[type=range]::-moz-range-thumb{
    width:30px; height:30px; border-radius:50%; background:var(--accent); border:3px solid var(--ink); cursor:grab;
  }
  .slider-ends{ display:flex; justify-content:space-between; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-faint); margin-top:6px; }

  @keyframes needleDrop{ 0%{ transform:translateX(-50%) scale(0.4); opacity:0; } 60%{ transform:translateX(-50%) scale(1.25); opacity:1; } 100%{ transform:translateX(-50%) scale(1); } }
  @keyframes pulseGlow{ 0%{ box-shadow:0 0 0 0 rgba(30,106,65,0.5); } 100%{ box-shadow:0 0 0 16px rgba(30,106,65,0); } }
  @keyframes shakeBad{ 0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-6px); } 40%{ transform:translateX(6px); } 60%{ transform:translateX(-4px); } 80%{ transform:translateX(4px); } }
  .verdict-row.tier-perfect, .verdict-row.tier-great{ animation:pulseGlow 0.9s ease-out; border-radius:8px; }
  .reveal.tier-bad .gauge{ animation:shakeBad 0.4s ease-in-out; }

  .reveal{ margin-top:18px; padding-top:16px; border-top:2px dashed var(--line); }
  .verdict-row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .verdict-row .pts{ font-family:'Fraunces',serif; font-weight:900; font-size:32px; }
  .verdict-row .pts.good{ color:var(--good); } .verdict-row .pts.mid{ color:var(--mid); } .verdict-row .pts.bad{ color:var(--bad); }
  .verdict-row .compare{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--ink-soft); text-align:right; }

  .gauge{ height:34px; border:2px solid var(--ink); border-radius:20px; position:relative; margin:14px 0 8px; overflow:hidden;
    background:linear-gradient(90deg, var(--bad-bg) 0%, var(--mid-bg) 30%, var(--good-bg) 48%, var(--good-bg) 52%, var(--mid-bg) 70%, var(--bad-bg) 100%); }
  .gauge .center-line{ position:absolute; left:50%; top:0; bottom:0; width:2px; background:var(--ink); opacity:0.5; }
  .gauge .needle{
    position:absolute; top:2px; bottom:2px; width:4px; background:var(--ink); border-radius:2px;
    transform:translateX(-50%); transition:left .6s cubic-bezier(.2,.8,.2,1);
    animation:needleDrop .5s cubic-bezier(.3,1.5,.4,1) .55s backwards;
  }
  .gauge-labels{ display:flex; justify-content:space-between; font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-faint); margin-bottom:14px; }

  .fact{ color:var(--ink-soft); line-height:1.55; font-size:14.5px; margin-bottom:18px; }
  .next-row{ display:flex; justify-content:flex-end; }

  .results{ text-align:center; }
  .results .score{ font-family:'Fraunces',serif; font-weight:900; font-size:56px; margin:6px 0 4px; }
  .results .score span{ font-size:24px; color:var(--ink-faint); font-weight:600; }
  .per-q{ display:flex; justify-content:center; gap:8px; margin:16px 0; flex-wrap:wrap; }
  .per-q .pill{ font-family:'IBM Plex Mono',monospace; font-size:12px; border:2px solid var(--ink); border-radius:20px; padding:5px 10px; }
  .share-box{
    font-family:'IBM Plex Mono',monospace; font-size:13px; background:var(--paper-2);
    border:2px dashed var(--ink); border-radius:4px; padding:14px; text-align:left;
    white-space:pre-wrap; margin:18px 0; line-height:1.6;
  }
  .actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .note{ font-size:12px; color:var(--ink-faint); margin-top:22px; line-height:1.6; }
  .streak-line{ font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--ink-soft); text-align:center; margin-bottom:16px; }
  .streak-line b{ color:var(--ink); font-family:'Fraunces',serif; font-size:16px; }
</style>
</head>
<body>
<div class="app">
  <div class="topline">
    <span>GUESSTIMATE — <span id="themeLabel">DAILY 5</span></span>
    <span id="topRight">1 / 5</span>
  </div>
  <div class="progress" id="progress"></div>
  <div class="panel" id="panel"></div>
  <p class="note">Prototype of the pivoted mechanic — guess a number instead of picking a caption. Uses the same 5 real datasets, reformulated as single-value questions. Scoring formula is a first pass and needs playtesting — see GUESSTIMATE_SPEC.md section 4.</p>
</div>

<script>
/* ============================= QUESTIONS ============================= */
// Same 5 real datasets, now reformulated as one guessable value each.
// No decoys needed — this is the whole point of the pivot.
const QUESTION_POOL = [
  {
    id:'hotdog', chartType:'line',
    data:[{y:2001,v:50},{y:2002,v:50},{y:2003,v:44.5},{y:2004,v:53.5},{y:2005,v:49},{y:2006,v:53.75},
          {y:2007,v:66},{y:2008,v:59},{y:2009,v:68},{y:2010,v:54},{y:2011,v:62},{y:2012,v:68},
          {y:2013,v:69},{y:2014,v:61},{y:2015,v:62},{y:2016,v:70},{y:2017,v:72},{y:2018,v:74},
          {y:2019,v:71},{y:2020,v:75},{y:2021,v:76},{y:2022,v:63},{y:2023,v:62},{y:2024,v:58},
          {y:2025,v:70.5},{y:2026,v:66}],
    question:"This is a contest's winning total by year. What's the current world record — the most hot dogs eaten in a single year?",
    unit:'hot dogs', answer:76, sliderRange:[0,100],
    fact:"It's the 2021 Nathan's Famous hot dog eating contest — Joey Chestnut's world record of 76 hot dogs in 10 minutes."
  },
  {
    id:'dogs', chartType:'bump',
    years:[2012,2015,2018,2020,2021,2022,2023,2024,2025],
    series:[
      {color:'#1b1810', ranks:[14,6,4,2,2,1,1,1,1]},
      {color:'#2f5fd6', ranks:[1,1,1,1,1,2,2,2,2]},
      {color:'#c88a00', ranks:[4,3,3,3,3,3,3,3,3]},
      {color:'#a13f2e', ranks:[2,2,2,2,4,4,4,4,4]},
      {color:'#6b4fa0', ranks:[8,7,7,6,5,5,5,5,6]},
    ],
    subjectIndex:0,
    question:"This tracks several dog breeds' popularity rank over time (rank #1 = most popular). Look at the highlighted line — in what year did it finally reach #1?",
    unit:'year', answer:2022, scoreMode:'absolute', tolerance:6, sliderRange:[2010,2026],
    fact:"It's the French Bulldog, which hit #1 in the AKC rankings in 2022 for the first time, ending the Labrador's 31-year run."
  },
  {
    id:'density', chartType:'bubble',
    data:[25927,22508,8539,6747,3933,2052,1713,1333,545,488,336,281,151,38,9,4.4,3.5],
    question:"These bubbles compare population density (bubble size = people per km²). The biggest bubble is the most densely populated place on Earth — about how many people live in every square kilometer there?",
    unit:'people/km²', answer:25927, rangeHint:'Typical range across countries: about 1 – 26,000 people/km²', sliderRange:[0,26000],
    fact:"It's Monaco — about 25,927 people per square kilometer, roughly 680x denser than the United States."
  },
  {
    id:'icecream', chartType:'bar',
    data:[17,15,8,8,8,6,6],
    question:"This bar chart is a survey of Americans' favorite ice cream flavor. What percent picked the #1 flavor (chocolate)?",
    unit:'%', answer:17, sliderRange:[0,100],
    fact:"17% picked chocolate, narrowly beating vanilla at 15%, in a YouGov survey of ~20,000 Americans."
  },
  {
    id:'pizza', chartType:'diverging',
    data:[12,24,49],
    question:"This shows how divisive pineapple is as a pizza topping. What percent of pizza eaters call it one of their least favorite toppings?",
    unit:'%', answer:24, sliderRange:[0,100],
    fact:"24% call pineapple a bottom-3 least favorite topping — though only 49% say the same about anchovy, the most hated topping overall."
  }
];

/* ============================= DAILY SELECTION (pure — portable to a server later) ============================= */
// Given a date string and the question pool, deterministically picks today's questions.
// Same date always produces the same result, so it doesn't matter where this runs — in
// the browser today (static site, no backend) or behind an API later. That portability
// is the actual architectural point: nothing else in the game needs to change when this
// function moves server-side, only where it's called from.
function hashString(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (Math.imul(31,h) + str.charCodeAt(i)) | 0; }
  return h >>> 0;
}
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, seed){
  const rng = mulberry32(seed);
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
// Fixed reference timezone so every player gets the same "today" regardless of their
// own — otherwise players in different timezones could be on different calendar days
// at the same real-world moment. GeoSports anchors to Eastern; picking any single fixed
// zone works, the important part is that it's the same one for everyone, always.
function todayDateString(tz='America/New_York'){
  return new Date().toLocaleDateString('en-CA', { timeZone: tz }); // e.g. "2026-08-05"
}
function selectDailyQuestions(dateStr, pool, count=5){
  const seed = hashString(dateStr);
  return seededShuffle(pool, seed).slice(0, Math.min(count, pool.length));
}
// Today's actual question set — this is what the rest of the game plays. With a pool
// this small (5) it mostly demonstrates deterministic ordering; the real payoff shows
// up once the pool is large enough that this also controls *which* 5 get picked (see
// the shuffled-bag anti-repeat refinement in GUESSTIMATE_SPEC.md section 6).
const TODAY = todayDateString();
const ROUNDS = selectDailyQuestions(TODAY, QUESTION_POOL, 5);

/* ============================= ANONYMIZED CHART RENDERERS (unchanged from prior prototype) ============================= */
const SVGNS='http://www.w3.org/2000/svg';
function el(tag, attrs={}){ const n=document.createElementNS(SVGNS, tag); for(const k in attrs) n.setAttribute(k, attrs[k]); return n; }
function scaleLinear(domain, range){ return (v)=> range[0] + (v-domain[0])/(domain[1]-domain[0]) * (range[1]-range[0]); }
function smoothPath(points){
  if(points.length<2) return '';
  let d = `M ${points[0][0]} ${points[0][1]}`;
  for(let i=0;i<points.length-1;i++){
    const p0=points[i-1]||points[i], p1=points[i], p2=points[i+1], p3=points[i+2]||p2;
    const c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
    const c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
    d+=` C ${c1x} ${c1y}, ${c2x} ${c2y}, ${p2[0]} ${p2[1]}`;
  }
  return d;
}
function renderAnonChart(svg, round){
  svg.innerHTML=''; svg.setAttribute('viewBox','0 0 400 160');
  const ink='#1b1810';
  if(round.chartType==='line'){
    const vals = round.data.map(d=>d.v);
    const x = scaleLinear([0, round.data.length-1],[16,384]);
    const y = scaleLinear([0, Math.max(...vals)*1.1],[144,16]);
    const pts = round.data.map((d,i)=>[x(i), y(d.v)]);
    const line = smoothPath(pts);
    const area = line + ` L ${x(round.data.length-1)} 144 L ${x(0)} 144 Z`;
    svg.appendChild(el('path',{d:area, fill:ink, 'fill-opacity':0.12}));
    svg.appendChild(el('path',{d:line, fill:'none', stroke:ink, 'stroke-width':3, 'stroke-linecap':'round'}));
  } else if(round.chartType==='bump'){
    const maxRank = Math.max(...round.series.flatMap(s=>s.ranks));
    const x = scaleLinear([0, round.years.length-1],[16,384]);
    const y = scaleLinear([1, maxRank],[16,144]);
    round.series.forEach((s,i)=>{
      const isSubject = round.subjectIndex === i;
      const pts = s.ranks.map((r,idx)=>[x(idx), y(r)]);
      svg.appendChild(el('path',{d:smoothPath(pts), fill:'none', stroke: isSubject ? s.color : '#b8b2a0', 'stroke-width': isSubject?4.5:2, 'stroke-linecap':'round', opacity: isSubject?1:0.55}));
      pts.forEach(([px,py])=> svg.appendChild(el('circle',{cx:px,cy:py,r:isSubject?4.5:3, fill: isSubject ? s.color : '#b8b2a0', opacity: isSubject?1:0.55})));
    });
  } else if(round.chartType==='bubble'){
    const sorted=[...round.data].sort((a,b)=>b-a);
    const max=sorted[0];
    const maxW = 384, startX = 16, rowGap = 6;
    let cx = startX, rowY = 40, rowMaxR = 0;
    sorted.forEach((v)=>{
      const r = Math.sqrt(v/max)*34+5;
      if(cx + r*2 + 8 > maxW){ // wrap to next row
        cx = startX;
        rowY += rowMaxR*2 + rowGap + 8;
        rowMaxR = 0;
      }
      cx += r;
      svg.appendChild(el('circle',{cx, cy:rowY, r, fill:'var(--paper)', stroke:ink, 'stroke-width':2}));
      cx += r+8;
      rowMaxR = Math.max(rowMaxR, r);
    });
  } else if(round.chartType==='bar'){
    const max=Math.max(...round.data);
    const bh = 140/round.data.length;
    round.data.forEach((v,i)=>{
      const y0 = 8 + i*bh + bh*0.22;
      const barH = bh*0.56;
      const w = (v/max)*340;
      svg.appendChild(el('rect',{x:16,y:y0,width:w,height:barH, fill:'var(--paper)', stroke:ink, 'stroke-width':2}));
    });
  } else if(round.chartType==='diverging'){
    const midX=200;
    const max=Math.max(...round.data);
    const scale=170/max;
    const rh=140/round.data.length;
    svg.appendChild(el('line',{x1:midX,x2:midX,y1:8,y2:152, stroke:ink, 'stroke-opacity':0.4,'stroke-width':1.5}));
    round.data.forEach((v,i)=>{
      const y0=10+i*rh+rh*0.2, bh=rh*0.5, w=v*scale;
      const dir = i===0 ? -1 : 1;
      const bar = el('rect',{y:y0,width:w,height:bh, fill: dir<0?'var(--paper)':ink, stroke:ink,'stroke-width':2});
      bar.setAttribute('x', dir<0 ? midX-w : midX);
      svg.appendChild(bar);
    });
  }
}

/* ============================= SCORING ============================= */
// Modeled directly on GeoSports' documented scoring (geosports.app/how-it-works):
// steep drop-off near a perfect guess, but the curve flattens at large errors instead
// of crushing bad guesses to 0 — "isn't totally crushing" is their own framing, and it's
// the right call here too. Exponential half-life decay gets this shape for free.
//
// HALF_LIFE = the error (in the normalized 0-100 "error units" below) at which score
// drops to 50. Tuned so a ~10% miss still scores well and a 100%+ miss trails to near-0
// rather than hitting a hard floor. Needs real playtesting same as the old formula did.
const HALF_LIFE = 25;
function scoreGuess(guess, round){
  let errorUnits;
  if(round.scoreMode === 'absolute'){
    // normalize so "1 tolerance-unit off" = 25 error-units (i.e. exactly half credit
    // at the tolerance boundary), consistent with the percent-mode scale below
    errorUnits = (Math.abs(guess - round.answer) / round.tolerance) * 25;
  } else {
    errorUnits = Math.abs(guess - round.answer) / Math.abs(round.answer) * 100;
  }
  const points = Math.round(100 * Math.pow(0.5, errorUnits / HALF_LIFE));
  return { points, errorPct: errorUnits };
}

// Escalating stakes across the round, same shape as GeoSports' 100/100/200/300/300 —
// later questions are worth more, so the round builds tension instead of feeling like
// 5 identical throwaway attempts. Multiplier applies to the 0-100 base score.
const QUESTION_MULTIPLIERS = [1, 1, 2, 3, 3];
const MAX_TOTAL = QUESTION_MULTIPLIERS.reduce((a,m)=>a+m,0) * 100; // 1000

// Tiered feedback, directly matching GeoSports' color/emoji system.
function scoreTier(points){
  if(points >= 100) return { emoji:'🟢', label:'Perfect' };
  if(points >= 90)  return { emoji:'🟢', label:'Great' };
  if(points >= 50)  return { emoji:'🟡', label:'Ballpark' };
  if(points >= 1)   return { emoji:'🔴', label:'Off' };
  return { emoji:'⚫', label:'Way off' };
}
function gaugePosition(errorPct, guess, answer){
  // clamp to +/-100% error for the visual, direction based on over/under guess
  const dir = guess >= answer ? 1 : -1;
  const clamped = Math.min(errorPct, 100);
  return 50 + dir * (clamped/100) * 48; // percent position across the gauge, 50 = center
}

/* ============================= STREAK ============================= */
const STATS_KEY = 'guesstimate_stats_v1';
function loadStats(){ try{ return JSON.parse(localStorage.getItem(STATS_KEY)) || {lastPlayed:null,currentStreak:0,bestStreak:0}; }catch(e){ return {lastPlayed:null,currentStreak:0,bestStreak:0}; } }
function saveStats(s){ try{ localStorage.setItem(STATS_KEY, JSON.stringify(s)); }catch(e){} }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function registerCompletion(){
  const s = loadStats(); const today = todayISO();
  if(s.lastPlayed === today) return s;
  const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
  s.currentStreak = (s.lastPlayed===yesterday) ? s.currentStreak+1 : 1;
  s.bestStreak = Math.max(s.bestStreak||0, s.currentStreak);
  s.lastPlayed = today; saveStats(s); return s;
}

/* ============================= GAME STATE ============================= */
let idx=0, answered=false, roundScores=[]; // {points, errorPct} per question
const panel = document.getElementById('panel');
const progressEl = document.getElementById('progress');
const topRight = document.getElementById('topRight');

function renderProgress(){
  progressEl.innerHTML='';
  ROUNDS.forEach((_,i)=>{
    const seg=document.createElement('div');
    seg.className='seg' + (i<idx?' done':'') + (i===idx?' active':'');
    progressEl.appendChild(seg);
  });
}

function startScreen(){
  topRight.textContent = `${ROUNDS.length} QUESTIONS`;
  const stats = loadStats();
  const streakHTML = stats.currentStreak>0 ? `<div class="streak-line">🔥 <b>${stats.currentStreak}</b>-day streak · best: <b>${stats.bestStreak}</b></div>` : '';
  panel.innerHTML = `
    <h1 class="title">Guesstimate</h1>
    <p class="sub">Five real stats. Guess the number — the closer you are, the more points you get.</p>
    <p class="range-hint" style="margin-bottom:16px;">Today: ${TODAY} — same 5 questions for everyone, in this order, until midnight.</p>
    ${streakHTML}
    <button class="primary" id="startBtn">Start today's 5 →</button>
  `;
  document.getElementById('startBtn').addEventListener('click', ()=>{ idx=0; roundScores=[]; renderProgress(); showQuestion(); });
  progressEl.innerHTML='';
}

function showQuestion(){
  answered=false;
  const mult = QUESTION_MULTIPLIERS[idx];
  topRight.textContent = `${idx+1} / ${ROUNDS.length}` + (mult>1 ? ` · ${mult}× POINTS` : '');
  renderProgress();
  const round = ROUNDS[idx];
  const [lo, hi] = round.sliderRange;
  const mid = Math.round((lo+hi)/2);
  panel.innerHTML = `
    <div class="chart-frame"><svg id="chartSvg"></svg></div>
    <p class="question">${round.question}</p>
    ${round.rangeHint ? `<p class="range-hint">${round.rangeHint}</p>` : ''}
    <div class="guess-row">
      <input type="number" id="guessInput" value="${mid}">
      <span class="unit">${round.unit}</span>
    </div>
    <div class="slider-wrap">
      <input type="range" id="guessSlider" min="${lo}" max="${hi}" value="${mid}" step="${hi-lo>1000?1:0.1}">
      <div class="slider-ends"><span>${lo.toLocaleString()}</span><span>drag to guess</span><span>${hi.toLocaleString()}</span></div>
    </div>
    <div class="next-row"><button class="primary" id="submitBtn">Submit guess</button></div>
    <div id="revealArea"></div>
  `;
  renderAnonChart(document.getElementById('chartSvg'), round);

  const input = document.getElementById('guessInput');
  const slider = document.getElementById('guessSlider');
  const syncSliderFill = ()=>{
    const pct = (slider.value - lo) / (hi - lo) * 100;
    slider.style.setProperty('--fill', pct + '%');
  };
  syncSliderFill();
  slider.addEventListener('input', ()=>{ input.value = slider.value; syncSliderFill(); });
  input.addEventListener('input', ()=>{
    const v = parseFloat(input.value);
    if(!isNaN(v)){ slider.value = Math.min(hi, Math.max(lo, v)); syncSliderFill(); }
  });

  const submit = ()=> submitGuess(round);
  document.getElementById('submitBtn').addEventListener('click', submit);
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } });
}

function submitGuess(round){
  if(answered) return;
  const input = document.getElementById('guessInput');
  const guess = parseFloat(input.value);
  if(isNaN(guess)){ input.focus(); return; }
  answered = true;
  input.disabled = true;
  document.getElementById('guessSlider').disabled = true;
  document.getElementById('submitBtn').disabled = true;

  const { points: basePoints, errorPct } = scoreGuess(guess, round);
  const multiplier = QUESTION_MULTIPLIERS[idx];
  const weightedPoints = basePoints * multiplier;
  const t = scoreTier(basePoints);
  roundScores.push({ points: weightedPoints, basePoints, tier: t });
  const tierClass = basePoints>=90 ? 'good' : basePoints>=50 ? 'mid' : 'bad';
  const pos = gaugePosition(errorPct, guess, round.answer);

  const tierAnimClass = basePoints>=90 ? 'tier-perfect' : basePoints<25 ? 'tier-bad' : '';

  document.getElementById('revealArea').innerHTML = `
    <div class="reveal ${tierAnimClass}">
      <div class="verdict-row ${tierAnimClass}">
        <div class="pts ${tierClass}">${t.emoji} ${t.label} — +${weightedPoints}${multiplier>1?` <span style="font-size:14px;color:var(--ink-faint);">(${basePoints}×${multiplier})</span>`:''}</div>
        <div class="compare">You: ${guess} ${round.unit}<br>Actual: ${round.answer} ${round.unit}</div>
      </div>
      <div class="gauge"><div class="center-line"></div><div class="needle" id="needle" style="left:50%"></div></div>
      <div class="gauge-labels"><span>far off</span><span>exact</span><span>far off</span></div>
      <p class="fact">${round.fact}</p>
      <div class="next-row"><button class="primary" id="nextBtn">${idx+1<ROUNDS.length?'Next question →':'See results →'}</button></div>
    </div>
  `;
  requestAnimationFrame(()=>{ document.getElementById('needle').style.left = pos + '%'; });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    idx++;
    if(idx>=ROUNDS.length) showResults(); else showQuestion();
  });
}

function showResults(){
  topRight.textContent='RESULTS';
  renderProgress();
  const total = roundScores.reduce((a,s)=>a+s.points,0);
  const stats = registerCompletion();
  const pills = roundScores.map(s=>`<span class="pill">${s.tier.emoji} +${s.points}</span>`).join('');
  const emojiRow = roundScores.map(s=>s.tier.emoji).join('');
  const shareText = `Guesstimate — Daily 5\n${emojiRow}\n${total}/${MAX_TOTAL} points\n🔥 ${stats.currentStreak}-day streak`;

  panel.innerHTML = `
    <div class="results">
      <div class="topline" style="justify-content:center;">ROUND COMPLETE</div>
      <div class="score">${total}<span>/${MAX_TOTAL}</span></div>
      <div class="per-q">${pills}</div>
      <div class="streak-line">🔥 <b>${stats.currentStreak}</b>-day streak · best: <b>${stats.bestStreak}</b></div>
      <div class="share-box">${shareText}</div>
      <div class="actions">
        <button class="ghost" id="copyBtn">Copy result</button>
        <button class="primary" id="againBtn">Play again</button>
      </div>
    </div>
  `;
  document.getElementById('againBtn').addEventListener('click', startScreen);
  document.getElementById('copyBtn').addEventListener('click', ()=>{
    navigator.clipboard?.writeText(shareText);
    const btn = document.getElementById('copyBtn');
    btn.textContent='Copied!'; setTimeout(()=>btn.textContent='Copy result',1200);
  });
}

startScreen();
</script>
</body>
</html>
