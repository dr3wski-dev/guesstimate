# Must match the Cloudflare Workers project this repo is connected to, which was
# created as "statmap". A mismatch does not fail loudly — wrangler simply deploys
# a SECOND Worker under the name in this file while the build project keeps its
# own, leaving an orphan that serves nothing and a route bound to the wrong one.
name = "statmap"
main = "src/index.js"
compatibility_date = "2026-08-10"

# The question pool is bundled into the Worker at build time via a JSON import in
# src/index.js, pointing at ../../data/questions.json — the same canonical file
# the content workflow already edits. There is no second copy to keep in sync,
# and adding questions means redeploying the Worker, not editing anything here.

# Deployed under the site's own domain rather than a separate *.workers.dev host.
# That is the whole reason the page's CSP can stay `connect-src 'self'` and why no
# CORS negotiation is involved: to the browser the API is same-origin.
#
# This route only binds once statmap.app is an active zone in the same Cloudflare
# account. If the deploy fails with a zone error, the domain's nameservers have not
# finished moving yet — wait, do not work around it by moving the API to a
# workers.dev host, because the page's CSP would then block every call it makes.
# BOTH hostnames, and the www one is not optional.
#
# Pages serves the page on statmap.app AND www.statmap.app. The client asks for
# `/api/daily` as a relative path, so on www it asks www.statmap.app/api/daily — and
# with only the apex routed here, nothing matched, Cloudflare fell through to Pages,
# and the browser got a 404 HTML page where it expected JSON. The page loaded, the
# chart never did, and the site looked broken to anyone who typed the www.
#
# It went unnoticed because every check reaches the apex: the canary requests
# https://statmap.app, the deploy verification requests the apex, and both were
# honestly green while www served nobody any questions. A monitor that only knows one
# of your hostnames is only monitoring one of your hostnames.
routes = [
  { pattern = "statmap.app/api/*", zone_name = "statmap.app" },
  { pattern = "www.statmap.app/api/*", zone_name = "statmap.app" }
]

# No KV, no D1, no Durable Objects, no secrets, no bindings of any kind. If this
# section ever grows one, the "stateless pure function" property that makes this
# thing free and un-abusable is gone, and the security posture in
# ACTION_PLAN.md section 3 needs rereading first.
